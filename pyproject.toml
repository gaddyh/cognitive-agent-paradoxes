[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognitive-agent-paradoxes"
version = "0.1.0"
description = "Cognitive Agent Paradoxes — LLM reasoning benchmark and agent architecture study"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "openai>=1.0",
    "python-dotenv",
    "dspy-ai>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
